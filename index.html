<style>
  :root {
    --bg: #FAFAFA;
    --text: #1A1A1A;
    --main: #1E3A5F;
    --accent: #2E7D8C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--main);
    margin-bottom: 12px;
  }
  p.tagline {
    font-size: 1.1rem;
    color: #5F5E5A;
    margin-bottom: 28px;
  }
  .accent-line {
    width: 80px;
    height: 4px;
    background: var(--accent);
    margin: 0 auto 28px;
    border-radius: 2px;
  }
  .coming-soon {
    font-size: 0.95rem;
    color: #8A8A85;
    margin-bottom: 28px;
  }
  .links {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--main);
    text-decoration: none;
    padding: 10px 18px;
    border: 1.5px solid var(--main);
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    background: var(--main);
    color: #FAFAFA;
  }
</style>
